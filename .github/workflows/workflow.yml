name: CI/CD Pipeline

on:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: "21"
  GRADLE_VERSION: "9.7.1"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache IDE downloads for verification
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/${{ env.GRADLE_VERSION }}/transforms
          key: ide-transforms-${{ hashFiles('gradle.properties') }}
          restore-keys: ide-transforms-

      - name: Verify plugin
        run: ./gradlew verifyPlugin

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Get artifact filename
        id: artifact
        run: echo "file=$(ls build/distributions/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.artifact.outputs.file }}
          generate_release_notes: true
